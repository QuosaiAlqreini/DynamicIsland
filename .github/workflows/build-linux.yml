name: Build Linux app

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write   # needed to publish a GitHub Release on version tags

jobs:
  build:
    runs-on: ubuntu-22.04     # older glibc: the build runs on more distros
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install system libraries (Qt xcb, virtual screen, helper tools)
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q xvfb libxcb-cursor0 libxkbcommon-x11-0 libxcb-icccm4 \
            libxcb-keysyms1 libxcb-xkb1 libxcb-shape0 libxcb-xinerama0 libxcb-randr0 \
            libxcb-render-util0 libxcb-image0 libegl1 x11-utils xdotool playerctl openbox

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pyinstaller pytest

      - name: Run tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest -q tests

      - name: Real X11 checks (hotkeys, click-through, fullscreen hiding)
        run: xvfb-run -a -s "-screen 0 1920x1080x24" python tests/linux_x11_probe.py

      - name: Build, self-test, package
        run: ./build-linux.sh

      - name: Upload build
        uses: actions/upload-artifact@v4
        with:
          name: DynamicIsland-linux
          path: installer_output/*
          if-no-files-found: error

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: installer_output/*
